[package]
name = "moi"
version = "0.1.2"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
