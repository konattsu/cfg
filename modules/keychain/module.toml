name = "keychain"
depends_on = ["zsh", "bash"]
notes = ["Add SSH keys to keychain manually as needed."]


[packages]
apt = ["keychain"]


[[dirs]]
path = "~/.config/moi"
mode = "755"


[[blocks]]
src = "files/keychain.sh"
dst = "~/.zshrc"
marker = "moi:keychain"


[[blocks]]
src = "files/keychain.sh"
dst = "~/.bashrc"
marker = "moi:keychain"
