name = "codex"
depends_on = ["node"]

notes = [
  "Codex execpolicy rules are installed to ~/.codex/rules/cfg.rules. Restart Codex after applying this module.",
  "devcontainer exec is approval-gated because it can run arbitrary commands inside a container.",
]


[packages]
apt = ["bubblewrap"]


[[dirs]]
path = "~/.codex/rules"
mode = "700"


[[files]]
src = "files/rules/cfg.rules"
dst = "~/.codex/rules/cfg.rules"
mode = "600"


[[commands]]
run = "npm install -g @openai/codex"
requires = ["npm"]
