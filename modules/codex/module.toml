name = "codex"
depends_on = ["node"]


[packages]
apt = ["bubblewrap"]
pacman = ["bubblewrap"]


[[dirs]]
path = "~/.codex/rules"
mode = "700"


[[files]]
src = "files/rules/moi.rules"
dst = "~/.codex/rules/moi.rules"
mode = "600"


[[commands]]
run = "npm install -g @openai/codex"
unless = "command -v codex"
requires = ["npm"]
