name = "git"
depends_on = ["zsh"]
notes = ["Remember to set the ssh key for signing commits."]


[packages]
apt = ["git"]


[[dirs]]
path = "~/.ssh"
mode = "700"


[[files]]
src = "files/.gitconfig"
dst = "~/.gitconfig"
mode = "644"

[[files]]
src = "files/allowed_signers"
dst = "~/.ssh/allowed_signers"
mode = "644"
