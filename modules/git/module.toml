name = "git"
depends_on = ["zsh"]
notes = ["Remember to set the ssh key for signing commits."]


[packages]
apt = ["git"]


[[dirs]]
path = "~/.ssh"
mode = "700"

[[dirs]]
path = "~/.config/cfg/git"
mode = "755"

[[files]]
src = "files/config"
dst = "~/.config/cfg/git/config"
mode = "644"

[[commands]]
run = """
git config --global --add include.path "$HOME/.config/cfg/git/config"
"""
unless = """
git config --global --get-all include.path 2>/dev/null | grep -Fx "$HOME/.config/cfg/git/config"
"""
requires = ["git", "grep"]
