[mgr]
show_hidden = true
linemode = "size_and_mtime"

[opener]
edit = [
    { run = 'nvim "$@"', block = true },
    { run = 'code "$@"', block = true },
]

[plugin]
prepend_previewers = [
    { url = "*.md", run = "rich-preview" },
    { url = "*.rst", run = "rich-preview" },
    { url = "*.csv", run = "rich-preview" },
    { url = "*.tsv", run = "rich-preview" },
    { url = "*.json", run = "rich-preview" },
    { url = "*.toml", run = "rich-preview" },
    { url = "*.yaml", run = "rich-preview" },
    { url = "*.yml", run = "rich-preview" },
]

append_previewers = [{ mime = "application/octet-stream", run = "hexyl" }]
