[[commands]]
run = """
mkdir -p "$HOME/.local/bin"
tmp="$(mktemp)"
curl -fL https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.appimage -o "$tmp"
chmod u+x "$tmp"
mv "$tmp" "$HOME/.local/bin/nvim"
"""
unless = """
test -x "$HOME/.local/bin/nvim" &&
"$HOME/.local/bin/nvim" --version | grep -Eq '^NVIM v0\\.(1[1-9]|[2-9][0-9])'
"""
requires = ["curl"]

[[commands]]
run = """
mkdir -p "$HOME/.local/bin"
ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
"""
unless = "command -v fd"
requires = ["fdfind"]


[env]
path_prepend = ["~/.local/bin"]
