name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  validate-version:
    name: validate version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate tag matches Cargo.toml version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "moi") | .version')"
          expected="v${version}"

          if [ "${{ github.ref_name }}" != "$expected" ]; then
            echo "tag must match Cargo.toml version"
            echo "tag:      ${{ github.ref_name }}"
            echo "expected: $expected"
            exit 1
          fi

  build-release:
    name: build ${{ matrix.target }}
    needs:
      - validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: moi-x86_64-unknown-linux-gnu
            linker: ''
          - target: aarch64-unknown-linux-gnu
            asset: moi-aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare asset
        run: |
          cp target/${{ matrix.target }}/release/moi ${{ matrix.asset }}
          chmod 755 ${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs:
      - build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install cargo-about
        run: scripts/install-cargo-about.sh

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate third-party license notices
        run: |
          cargo about generate \
            --locked \
            --fail \
            --config cargo-about/about.toml \
            --output-file dist/THIRD-PARTY-LICENSES.txt \
            cargo-about/about.txt.hbs

      - name: Package release assets
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            package="moi-${target}"
            package_root="$(mktemp -d)"

            mkdir "${package_root}/${package}"
            install -m 755 "dist/${package}" "${package_root}/${package}/moi"
            cp LICENSE-MIT LICENSE-APACHE dist/THIRD-PARTY-LICENSES.txt "${package_root}/${package}/"
            tar -C "$package_root" -czf "dist/${package}.tar.gz" "$package"
            (cd dist && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")

            rm -rf "$package_root" "dist/${package}"
          done

          rm dist/THIRD-PARTY-LICENSES.txt

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
