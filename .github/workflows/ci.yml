name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'rust-toolchain.toml'
      - 'rust-toolchain'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - '.rustfmt.toml'
      - 'rust-toolchain.toml'
      - 'rust-toolchain'

permissions:
  contents: read

jobs:
  ci:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::all

      - name: Run tests
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --all-targets --all-features
